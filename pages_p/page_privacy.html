<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Политика конфиденциальности — MoneyApp</title>
    <style>
        :root { --bg: #09090b; --card: #18181b; --border: #222222; --accent: #ef4444; --text: #f4f4f5; --muted: #a1a1aa; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card); padding: 3rem; border-radius: 1.25rem; border: 1px solid var(--border); }
        h1 { color: #fca5a5; margin-top: 0; font-size: 2rem; margin-bottom: 0.5rem; }
        .effective-date { color: var(--muted); font-size: 0.9rem; margin-bottom: 2.5rem; display: block; }
        h2 { color: #e4e4e7; margin-top: 2.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; font-size: 1.25rem; }
        p, li { color: var(--muted); font-size: 1rem; }
        ul { padding-left: 1.5rem; margin-top: 0.5rem; }
        li { margin-bottom: 0.5rem; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; font-weight: 600; font-size: 1rem; color: var(--muted); transition: color 0.2s; }
        .back-link:hover { color: var(--text); text-decoration: none; }
        .contact-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.1); padding: 1.5rem; border-radius: 12px; margin-top: 2rem; }
        .contact-box p { color: var(--text); margin: 0; }
        @media (max-width: 600px) { body { padding: 1rem; } .container { padding: 1.5rem; } }
    </style>
</head>
<body>
<a href="/" style="position: fixed; top: 1.5rem; left: 1.5rem; width: 3.5rem; height: 3.5rem; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease; text-decoration: none;">
  <img src="/transp_icon.png" alt="" style="width: 100%; height: 100%; object-fit: contain;">
</a>
    <div class="container">
        <a href="/" class="back-link">← Вернуться на главную</a>
        <h1>Политика конфиденциальности</h1>
        <span class="effective-date">Дата вступления в силу: 18 сентября 2026 г.</span>
        <p>Разработчик приложения MoneyApp («мы», «нас» или «наш») уважает вашу конфиденциальность.</p>
        <div class="contact-box">
            <h3 style="margin-top: 0; color: #fca5a5;">Контакты для запроса удаления данных</h3>
            <p><strong><a href="mailto:yamaladec@gmail.com">yamaladec@gmail.com</a></strong></p>
        </div>
    </div>
</body>
</html>
