<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting…</title>
<link rel="canonical" href="{{ site.url }}{{ page.redirect_to }}">
<meta name="robots" content="noindex">

</head>
<body><a href="{{ page.redirect_to }}">{{ site.url }}{{ page.redirect_to }}</a></body>
</html>
