hero_title: "صوّر الإيصال، ويُسجَّل المصروف تلقائيًا."
hero_sub: "ClearSlip تطبيق لإدارة المال الشخصي على Android. يقرأ الإيصالات بالذكاء الاصطناعي، ويستورد كشوف الحسابات البنكية، ويحفظ كل حساب بعملته الخاصة. بلا إعلانات."
hero_note: "غير متوفر على Google Play بعد. ثبّت ملف APK من هذه الصفحة."

