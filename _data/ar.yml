features_title: "كل ما يمكن أن يخبرك به الإيصال"
features_lead: "يُعفيك ClearSlip من الكتابة في الميزانية. معظم القيود تأتي من صورة أو ملف بنكي أو لمسة واحدة."
features:
  - icon: receipt
    title: "مسح الإيصالات"
    text: "يُملأ المبلغ والتاريخ والمتجر والعناصر والفئة من الصورة. ويُحوَّل الإيصال بعملة أخرى إلى عملة الحساب."
  - icon: bank
    title: "استيراد كشوف الحساب"
    text: "حمّل كشف حساب من Ziraat Bankası أو VakıfBank (Excel أو PDF)، فتُطابَق كل عملية مع إيصالاتك مع إرفاق الرسوم البنكية. وتُقرأ إشعارات التحويل بصيغة PDF من أي بنك أيضًا."
  - icon: currency
    title: "أي عملة، وحتى الذهب"
    text: "احتفظ بالنقد والبطاقات والمدخرات وبطاقات الائتمان بعملات مختلفة. تُحسب الإجماليات بأسعار الصرف الحالية، وهي تقريبية."
  - icon: budget
    title: "الميزانيات والاشتراكات"
    text: "حدّد حدًا شهريًا لكل فئة وشاهد المتبقي. ضع علامة «مدفوع» على دفعة متكررة فيُضاف المصروف تلقائيًا."
  - icon: chart
    title: "تحليلات واضحة"
    text: "شاهد إنفاقك حسب الفئة والمتجر والمنتج، بما في ذلك تغيّر سعر المنتج من إيصال إلى آخر."
  - icon: cart
    title: "قائمة التسوق"
    text: "خطّط لمشترياتك مع تقدير الأسعار من إيصالاتك السابقة، وشارك قائمة مع مجموعتك ليرى الجميع من سيشتري ماذا."
  - icon: users
    title: "المصروفات المشتركة والديون"
    text: "قسّم الشراء مع العائلة أو الأصدقاء، بالتساوي أو حسب عناصر الإيصال، واعرف من يدين لمن، وتابع المال الذي أقرضته أو اقترضته."
  - icon: bolt
    title: "إدخال بلمسة واحدة"
    text: "احفظ المدفوعات المتكررة، مثل أجرة الحافلة، كقوالب. أضفها من التطبيق أو من ودجت الشاشة الرئيسية."

