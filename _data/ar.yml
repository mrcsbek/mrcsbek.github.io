how_title: "من الإيصال إلى الميزانية في ثلاث خطوات"
how:
  - title: "التقط صورة"
    text: "وجّه الكاميرا إلى الإيصال، أو شارك صورة أو ملف PDF مع ClearSlip من أي تطبيق."
  - title: "راجع التفاصيل"
    text: "المبلغ والتاريخ والمتجر والفئة مملوءة مسبقًا. صحّح أي شيء بلمسة."
  - title: "احفظ"
    text: "يذهب المصروف إلى الحساب الصحيح وتبقى صورة الإيصال مرفقة به."

privacy_title: "بياناتك تبقى لك"
privacy_lead: "يطوّر ClearSlip شخص واحد ولا يعرض أي إعلانات. إليك بالضبط ما يحدث لبياناتك."
privacy_more: "اقرأ سياسة الخصوصية"
privacy:
  - "تُحفظ البيانات على خادم المطوّر الخاص، في قاعدة بيانات منفصلة لكل مستخدم. لا إعلانات ولا أدوات تتبّع إعلانية."
  - "لقراءة إيصال أو ملاحظة صوتية، تُرسل الصورة أو التسجيل إلى Google Gemini، أو إلى نموذج ذكاء اصطناعي احتياطي عبر OpenRouter. أدخل المصروف يدويًا إن كنت تفضّل عدم الإرسال."
  - "تقارير الأعطال (Sentry) لا تحتوي على مبالغ أو أسماء أو صور إيصالات."
  - "يمكنك حذف حسابك مع جميع بياناته من التطبيق في أي وقت."

install_title: "طريقة التثبيت"
install_note: "ClearSlip غير متوفر على Google Play بعد، لذا يطلب Android تأكيد التثبيت مرة واحدة. تُنشر الإصدارات الجديدة على هذه الصفحة."
install:
  - "نزّل ملف APK على هاتف Android."
  - "افتح الملف الذي نزّلته. إذا طلب Android ذلك، اسمح للمتصفح أو مدير الملفات بتثبيت التطبيقات."
  - "إذا حذّر Google Play Protect من تطبيق غير معروف، اضغط «مزيد من التفاصيل» ثم «التثبيت على أي حال»."
  - "افتح ClearSlip وأنشئ حسابًا باسم مستخدم وكلمة مرور."

faq_title: "الأسئلة"
faq:
  - q: "هل ClearSlip مجاني؟"
    a: "نعم. لا إعلانات ولا اشتراكات. التعرف على الإيصالات محدود بـ 20 عملية مسح يوميًا لكل حساب كي تبقى الخدمة مجانية. إن أردت المساعدة، استخدم زر الدعم أدناه."
  - q: "هل توجد نسخة لـ iPhone؟"
    a: "ليس بعد. حاليًا ClearSlip متاح لنظام Android فقط."
  - q: "هل يعمل دون إنترنت؟"
    a: "نعم. تُفتح الحسابات والمعاملات من الهاتف، وكل ما تضيفه أو تعدّله أو تحذفه دون اتصال يُحفظ ثم يُرسل فور عودة الاتصال. مسح الإيصالات واستيراد الكشوف يحتاجان إلى الإنترنت."
  - q: "ما البنوك المدعومة؟"
    a: "يعمل الاستيراد الكامل للكشوف مع Ziraat Bankası وVakıfBank، وتُقرأ كشوف PDF من بنوك أخرى إذا احتوت على جدول. تُقرأ إشعارات التحويل بصيغة PDF بالذكاء الاصطناعي، ويمكن متابعة حسابات أي بنك يدويًا."
  - q: "ما مدى دقة التعرف على الإيصالات؟"
    a: "تُقرأ الإيصالات الواضحة جيدًا، لكن قد يخطئ الذكاء الاصطناعي مع الورق الباهت أو المجعّد. تُعلَّم الإيصالات المرسلة للمسح في الخلفية بـ «للمراجعة» لتتمكن من التحقق منها."
  - q: "كيف أحذف بياناتي؟"
    a: "افتح شاشة الحساب في التطبيق واختر حذف الحساب. تُمحى المعاملات والإيصالات والحسابات فورًا. يمكنك أيضًا مراسلة المطوّر بالبريد."

changelog_title: "ما الجديد"
changelog:
  - date: "1.2.9، أكتوبر 2026"
    text: "القوالب: تعديل الاسم والمبلغ والحساب، وعملة خاصة بالقالب تُحوَّل بسعر اليوم، وأيقونات ومبالغ بخانات عشرية. عاد زر «تراجع» للعمل بعد القالب السريع. الحذف دون إنترنت يحدّث الرصيد فورًا، بما في ذلك التحويلات. إصلاحات صغيرة في الواجهة."
  - date: "1.2.8، أكتوبر 2026"
    text: "إصلاحات بعد الاختبار على الهاتف: تُفتح المعاملة وتُعدَّل دون إنترنت، والحذف دون اتصال يحدّث الرصيد فورًا، ويبقى جدول المصروفات المشتركة صحيحًا بعد «تمت التسوية». يضع الإيصال اسم المتجر في «المكان»، وتظهر المبالغ دائمًا بخانتين عشريتين، ولم تعد اللمسة الأولى تضيع عندما تكون لوحة المفاتيح مفتوحة."
  - date: "1.2.7، أكتوبر 2026"
    text: "التطبيق متاح الآن بالفرنسية والعربية، مع واجهة معكوسة بالكامل من اليمين إلى اليسار للعربية. تحديث سياسة الخصوصية وشروط الاستخدام لتصف الإدخال الصوتي والعمل دون إنترنت بدقة. في المصروفات المشتركة زر «تمت التسوية» يغلق الدين بلمسة واحدة، ويمكن إلغاء التسوية."
  - date: "1.2.6، أكتوبر 2026"
    text: "عمل كامل دون إنترنت: تُفتح الحسابات والمعاملات وغيرها فورًا، وأي تغيير — تعديل أو حذف أو قائمة التسوق — يُحفظ على الهاتف ويُرسل تلقائيًا عند عودة الاتصال. تقسيم الإيصال المشترك حسب العناصر، وقائمة تسوق مشتركة للمجموعة مع «من سيشتري»، والقطع أو الكيلوغرامات في القائمة. استيراد كشوف VakıfBank وكشوف PDF. تعريف قصير عند أول تشغيل."
  - date: "1.2.4، أكتوبر 2026"
    text: "العمل دون إنترنت: تُحفظ المعاملات والديون والتحويلات والإيصالات على الهاتف وتُرسل تلقائيًا، ويدل الإجمالي الوامض على غياب الاتصال. أرشيف الحسابات، وتصفية حسب الفئة، وسداد الدين بلمسة، وسعر الصرف والمبلغ المستلم في التحويل بين العملات. إصلاحات للمشتريات المشتركة والقوالب والأماكن وعشرات التفاصيل."
  - date: "1.2.1، أكتوبر 2026"
    text: "أرشيف الحسابات وتصفية المعاملات حسب الفئة. الحذف بالسحب يطلب التأكيد الآن. تصل التذكيرات في موعدها بأيقونة إشعار جديدة. حماية أقوى للبيانات والخادم."
  - date: "1.2.0، أكتوبر 2026"
    text: "إصلاحات بعد الاختبار التجريبي: الحساب والعملة الصحيحان عند الإضافة، وإدخال آمن للتاريخ، وتحويلات تبقى مترابطة، وعمل «مدفوع» و«مسح السجل». التطبيق مترجم إلى ست لغات. زر لتسجيل الخروج وعنوان خادم جديد."
  - date: "1.1.0، سبتمبر 2026"
    text: "ودجت للشاشة الرئيسية بأحجام 4×1 و1×4 و1×1. مسح الإيصالات في الخلفية مع علامة «للمراجعة». لوحة أرقام لتصحيح الأرصدة. تطبيق أخف."
  - date: "1.0، سبتمبر 2026"
    text: "قوائم تسوق مع تقدير الأسعار. تشغيل فوري دون إنترنت. قوالب متزامنة مع الحساب. استيراد الملفات عبر قائمة «مشاركة» في النظام."
  - date: "0.9، سبتمبر 2026"
    text: "تحليلات المنتجات ومقارنة الأسعار بين المتاجر. الذهب كعملة. ديون بعدة عملات، وشعارات البنوك، وست لغات."
  - date: "0.8، أغسطس 2026"
    text: "استيراد كشوف Ziraat Bankası مع فرز التحويلات والرسوم ومطابقتها مع الإيصالات الورقية."
  - date: "0.5 إلى 0.7، صيف 2026"
    text: "الحسابات والبطاقات والمدخرات. أول نسخة من التعرف على الإيصالات بالذكاء الاصطناعي، والتحويل بأسعار مباشرة، وحدود الميزانية."

