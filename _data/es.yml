hero_title: "Fotografía el ticket. El gasto se rellena solo."
hero_sub: "ClearSlip es una app de finanzas personales para Android. Lee tickets con IA, importa extractos bancarios y lleva cada cuenta en su propia moneda. Sin anuncios."
