how_title: "Del ticket al presupuesto en tres pasos"
how:
  - title: "Haz una foto"
    text: "Apunta la cámara al ticket o comparte una foto o un PDF con ClearSlip desde cualquier app."
  - title: "Revisa los datos"
    text: "Importe, fecha, tienda y categoría ya están rellenados. Corrige lo que haga falta con un toque."
  - title: "Guarda"
    text: "El gasto va a la cuenta correcta y la foto del ticket queda adjunta."

privacy_title: "Tus datos siguen siendo tuyos"
privacy_lead: "ClearSlip lo desarrolla una sola persona y no muestra anuncios. Esto es exactamente lo que pasa con tus datos."
privacy_more: "Leer la política de privacidad"
privacy:
  - "Los datos se guardan en el servidor propio del desarrollador, en una base de datos separada para cada usuario. Sin anuncios ni rastreadores publicitarios."
  - "Para leer un ticket, su foto se envía a Google Gemini o a un modelo de IA de reserva a través de OpenRouter. Si prefieres no enviarla, introduce el gasto a mano."
  - "Los informes de errores (Sentry) no contienen importes, nombres de movimientos ni fotos de tickets."
  - "Puedes borrar tu cuenta con todos sus datos desde la app en cualquier momento."

install_title: "Cómo instalar"
install_note: "ClearSlip aún no está en Google Play, por eso Android te pide confirmar la instalación una vez. Las nuevas versiones se publican en esta página."
install:
  - "Descarga el APK en tu móvil Android."
  - "Abre el archivo descargado. Si Android lo pide, permite que tu navegador o gestor de archivos instale apps."
  - "Si Google Play Protect avisa de una app desconocida, toca «Más detalles» y luego «Instalar de todos modos»."
  - "Abre ClearSlip y crea una cuenta con usuario y contraseña."

faq_title: "Preguntas"
faq:
  - q: "¿ClearSlip es gratis?"
    a: "Sí. No hay anuncios ni suscripciones. El reconocimiento de tickets está limitado a 50 escaneos al día por cuenta para que el servicio siga siendo gratuito. Si quieres ayudar, usa el botón de apoyo de abajo."
  - q: "¿Hay versión para iPhone?"
    a: "Todavía no. Por ahora ClearSlip solo está disponible para Android."
  - q: "¿Funciona sin internet?"
    a: "Puedes añadir gastos sin conexión; se envían en cuanto vuelve la conexión. Escanear tickets e importar extractos requiere internet."
  - q: "¿Qué bancos son compatibles?"
    a: "La importación completa de extractos funciona por ahora con Ziraat Bankası. La IA lee los justificantes PDF de otros bancos, y las cuentas de cualquier banco se pueden llevar a mano."
  - q: "¿Qué tan preciso es el reconocimiento?"
    a: "Los tickets nítidos se leen bien, pero con papel desteñido o arrugado la IA puede equivocarse. Los tickets escaneados en segundo plano se marcan con «Revisar» para que los compruebes."
  - q: "¿Cómo borro mis datos?"
    a: "Abre la pantalla Cuenta en la app y elige borrar la cuenta. Movimientos, tickets y cuentas se eliminan al instante. También puedes escribir al desarrollador por correo."

changelog_title: "Novedades"
changelog:
  - date: "1.1.0, septiembre de 2026"
    text: "Widgets para la pantalla de inicio de 4×1, 1×4 y 1×1. Escaneo de tickets en segundo plano con la marca «Revisar». Teclado numérico para corregir saldos. App más ligera."
  - date: "1.0, septiembre de 2026"
    text: "Listas de la compra con estimación de precios. Inicio instantáneo sin internet. Plantillas sincronizadas con tu cuenta. Importación de archivos desde el menú Compartir del sistema."
  - date: "0.9, septiembre de 2026"
    text: "Análisis por producto y comparación de precios entre tiendas. Oro como moneda. Deudas en varias monedas, logotipos de bancos y seis idiomas."
  - date: "0.8, agosto de 2026"
    text: "Importación de extractos de Ziraat Bankası que separa transferencias y comisiones y las cruza con los tickets en papel."
  - date: "0.5–0.7, verano de 2026"
    text: "Cuentas, tarjetas y ahorros. Primera versión del reconocimiento de tickets, conversión al tipo actual y límites de presupuesto."

