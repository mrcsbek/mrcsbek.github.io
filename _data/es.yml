changelog_title: "Registro de actualizaciones"
changelog:
  - date: "Versión 1.0 (21 de septiembre de 2026)"
    text: "Gran actualización. 5 widgets interactivos. Escaneo de recibos en segundo plano con validación de sumas. Teclado numérico para saldos. Tamaño de la app reducido."
  - date: "Versión 0.9 (Mediados de septiembre)"
    text: "Listas de compras con predicción de precios. Inicio sin conexión. Plantillas en la nube e integración de 'Compartir' para importación rápida."
  - date: "Versión 0.8 (Principios de septiembre)"
    text: "Análisis por producto: seguimiento de precios y comparación de tiendas. El oro como moneda. Deudas multidivisa, logotipos bancarios y 6 idiomas."
  - date: "Versión 0.7 (Fines de agosto)"
    text: "Importación de extractos bancarios (Ziraat). Clasificación automática de transferencias. Conciliación de recibos en papel con historial bancario."
  - date: "Versión 0.5 (Agosto)"
    text: "Versión alfa: cuentas y ahorros. Reconocimiento básico de recibos por IA, multidivisa en vivo y límites de presupuesto."
interface_title: "Interfaz pensada al detalle"
