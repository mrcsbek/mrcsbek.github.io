features_title: "Todo lo que un ticket puede contar"
features_lead: "ClearSlip quita el tecleo de llevar un presupuesto. La mayoría de los movimientos salen de una foto, de un archivo del banco o de un toque."
features:
  - icon: receipt
    title: "Escanear tickets"
    text: "Importe, fecha, tienda, productos y categoría se rellenan a partir de una foto. Un ticket en otra moneda se convierte a la moneda de la cuenta."
  - icon: bank
    title: "Importar extractos"
    text: "Carga un extracto de Ziraat Bankası y cada línea se empareja con tus tickets, con las comisiones del banco incluidas. También se leen los justificantes PDF de transferencias de cualquier banco."
  - icon: currency
    title: "Cualquier moneda, y oro"
    text: "Lleva efectivo, tarjetas, ahorros y tarjetas de crédito en distintas monedas. Los totales usan el tipo de cambio actual, que es aproximado."
  - icon: budget
    title: "Presupuestos y suscripciones"
    text: "Pon un límite mensual a una categoría y mira cuánto queda. Marca un pago periódico como pagado y el gasto se añade solo."
  - icon: chart
    title: "Análisis claro"
    text: "Mira el gasto por categoría, por tienda y por producto, incluido cómo cambia el precio de un producto de un ticket a otro."
  - icon: cart
    title: "Lista de la compra"
    text: "Planifica lo que vas a comprar y consulta precios estimados según tus tickets anteriores."
  - icon: users
    title: "Gastos compartidos y deudas"
    text: "Reparte una compra con la familia o los amigos, mira quién debe a quién y controla el dinero que prestaste o pediste prestado."
  - icon: bolt
    title: "Movimientos con un toque"
    text: "Guarda pagos habituales, como el billete de autobús, como plantillas. Añádelos desde la app o desde un widget de la pantalla de inicio."

