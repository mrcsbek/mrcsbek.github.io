new3_title: "Multidivisa y metales"
new3_desc: "Conversión automática de cualquier divisa a la moneda principal de la cuenta."
new4_title: "Hoja de ruta: En desarrollo"
new4_desc: "Widgets de escritorio, devoluciones sin recibo de papel e integración de listas de compras."
