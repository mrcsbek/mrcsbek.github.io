how_title: "Fişten bütçeye üç adımda"
how:
  - title: "Fotoğraf çekin"
    text: "Kamerayı fişe tutun ya da herhangi bir uygulamadan fotoğraf veya PDF'i ClearSlip ile paylaşın."
  - title: "Kontrol edin"
    text: "Tutar, tarih, mağaza ve kategori hazır. Yanlış olanı tek dokunuşla düzeltin."
  - title: "Kaydedin"
    text: "Harcama doğru hesaba gider, fişin fotoğrafı da ona ekli kalır."

privacy_title: "Verileriniz sizde kalır"
privacy_lead: "ClearSlip'i tek bir kişi geliştiriyor ve uygulamada reklam yok. Verilerinize tam olarak ne olduğu aşağıda."
privacy_more: "Gizlilik politikasını okuyun"
privacy:
  - "Veriler geliştiricinin kendi sunucusunda, her kullanıcı için ayrı bir veritabanında tutulur. Reklam ve reklam takipçisi yok."
  - "Bir fişi veya sesli notu okumak için fotoğraf ya da kayıt Google Gemini'ye veya OpenRouter üzerinden yedek bir yapay zekâ modeline gönderilir. Göndermek istemezseniz harcamayı elle girin."
  - "Hata raporları (Sentry) tutar, işlem adı veya fiş fotoğrafı içermez."
  - "Hesabınızı tüm verileriyle birlikte istediğiniz zaman uygulamadan silebilirsiniz."

install_title: "Nasıl kurulur"
install_note: "ClearSlip henüz Google Play'de değil, bu yüzden Android kurulumu bir kez onaylamanızı ister. Yeni sürümler bu sayfada yayınlanır."
install:
  - "APK'yı Android telefonunuza indirin."
  - "İndirilen dosyayı açın. Android sorarsa tarayıcınıza veya dosya yöneticinize uygulama yükleme izni verin."
  - "Google Play Protect bilinmeyen uygulama uyarısı verirse “Diğer ayrıntılar”a, ardından “Yine de yükle”ye dokunun."
  - "ClearSlip'i açın ve kullanıcı adı ile şifreyle hesap oluşturun."

faq_title: "Sorular"
faq:
  - q: "ClearSlip ücretsiz mi?"
    a: "Evet. Reklam ve abonelik yok. Hizmetin ücretsiz kalabilmesi için fiş tanıma hesap başına günde 20 taramayla sınırlıdır. Destek olmak isterseniz aşağıdaki destek düğmesini kullanın."
  - q: "iPhone sürümü var mı?"
    a: "Henüz yok. ClearSlip şimdilik yalnızca Android için."
  - q: "İnternetsiz çalışır mı?"
    a: "Evet. Hesaplar ve işlemler telefondan açılır; çevrimdışıyken eklediğiniz, değiştirdiğiniz veya sildiğiniz her şey saklanır ve bağlantı gelince gönderilir. Fiş tarama ve ekstre aktarma için internet gerekir."
  - q: "Hangi bankalar destekleniyor?"
    a: "Tam ekstre aktarma Ziraat Bankası ve VakıfBank ile çalışır; diğer bankaların PDF ekstreleri tablo içeriyorsa okunur. PDF dekontları yapay zekâ okur, her bankadaki hesabı elle de tutabilirsiniz."
  - q: "Fiş tanıma ne kadar doğru?"
    a: "Net fişler iyi okunur, ama solmuş ya da buruşmuş kâğıtta yapay zekâ yanılabilir. Arka planda taranan fişler kontrol edebilmeniz için “Kontrol et” ile işaretlenir."
  - q: "Verilerimi nasıl silerim?"
    a: "Uygulamada Hesap ekranını açın ve hesabı silmeyi seçin. İşlemler, fişler ve hesaplar hemen silinir. Geliştiriciye e-postayla da yazabilirsiniz."

changelog_title: "Yenilikler"
changelog:
  - date: "1.2.7, Ekim 2026"
    text: "Uygulama artık Fransızca ve Arapça; Arapça için arayüz tamamen sağdan sola çevrildi. Gizlilik politikası ve kullanım koşulları güncellendi: sesli giriş ve çevrimdışı çalışma doğru şekilde anlatılıyor. Ortak harcamalarda “Ödeşildi” düğmesi: borç tek dokunuşla kapanır, ödeşme geri alınabilir."
  - date: "1.2.6, Ekim 2026"
    text: "Tam çevrimdışı çalışma: hesaplar, işlemler ve diğer her şey anında açılır; düzenleme, silme, alışveriş listesi gibi her değişiklik telefonda saklanır ve bağlantı gelince kendiliğinden gönderilir. Ortak fişi kalemlere göre bölme, grup için “kim alacak” işaretli ortak alışveriş listesi, listede adet veya kilogram. VakıfBank ve PDF ekstre içe aktarma. İlk girişte kısa tanıtım."
  - date: "1.2.4, Ekim 2026"
    text: "İnternetsiz çalışma: işlemler, borçlar, transferler ve fişler telefona kaydedilir ve kendiliğinden gönderilir; yanıp sönen toplam bağlantı olmadığını gösterir. Hesap arşivi, kategori filtresi, tek dokunuşla borç kapatma, döviz transferlerinde kur ve gelen tutar. Ortak alışverişler, şablonlar, yerler ve onlarca küçük düzeltme."
  - date: "1.2.1, Ekim 2026"
    text: "Hesap arşivi ve işlemleri kategoriye göre filtreleme. Kaydırarak silme artık onay istiyor. Hatırlatıcılar tam zamanında geliyor, yeni bildirim simgesi. Veri ve sunucu güvenliği güçlendirildi."
  - date: "1.2.0, Ekim 2026"
    text: "Beta testinden düzeltmeler: eklerken doğru hesap ve para birimi, güvenli tarih girişi, transferler artık bölünmüyor, «Ödendi» ve «Geçmişi temizle» çalışıyor. Uygulama altı dile tamamen çevrildi. Çıkış düğmesi ve yeni sunucu adresi."
  - date: "1.1.0, Eylül 2026"
    text: "4×1, 1×4 ve 1×1 boyutlarında ana ekran widget'ları. “Kontrol et” işaretli arka planda fiş tarama. Bakiye düzeltmek için sayı tuş takımı. Daha küçük uygulama boyutu."
  - date: "1.0, Eylül 2026"
    text: "Fiyat tahminli alışveriş listeleri. İnternetsiz anında açılış. Hesabınızla eşitlenen şablonlar. Sistem Paylaş menüsüyle dosya aktarma."
  - date: "0.9, Eylül 2026"
    text: "Ürün analizi ve mağazalar arası fiyat karşılaştırması. Para birimi olarak altın. Birden çok para biriminde borçlar, banka logoları ve altı dil."
  - date: "0.8, Ağustos 2026"
    text: "Havaleleri ve masrafları ayıran, kâğıt fişlerle eşleştiren Ziraat Bankası ekstre aktarımı."
  - date: "0.5–0.7, yaz 2026"
    text: "Hesaplar, kartlar ve birikimler. Fiş tanımanın ilk sürümü, güncel kurla çevirme ve bütçe limitleri."

