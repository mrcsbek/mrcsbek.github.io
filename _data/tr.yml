features_title: "Bir fişin anlatabildiği her şey"
features_lead: "ClearSlip bütçe tutmayı elle yazmaktan kurtarır. Kayıtların çoğu bir fotoğraftan, bir banka dosyasından ya da tek dokunuştan gelir."
features:
  - icon: receipt
    title: "Fiş tarama"
    text: "Tutar, tarih, mağaza, ürünler ve kategori fotoğraftan doldurulur. Başka para birimindeki fiş, hesabın para birimine çevrilir."
  - icon: bank
    title: "Ekstre içe aktarma"
    text: "Ziraat Bankası veya VakıfBank ekstresini (Excel ya da PDF) yükleyin; her satır fişlerinizle eşleşir, banka masrafları işlemlere eklenir. Her bankanın PDF dekontları da okunur."
  - icon: currency
    title: "Her para birimi ve altın"
    text: "Nakit, kart, birikim ve kredi kartlarını farklı para birimlerinde tutun. Toplamlar güncel kurla hesaplanır, kur yaklaşıktır."
  - icon: budget
    title: "Bütçeler ve abonelikler"
    text: "Bir kategoriye aylık limit koyun ve ne kadar kaldığını görün. Düzenli ödemeyi ödendi olarak işaretleyin, harcama kendiliğinden eklensin."
  - icon: chart
    title: "Anlaşılır analiz"
    text: "Harcamaları kategoriye, mağazaya ve ürüne göre görün; bir ürünün fiyatının fişten fişe nasıl değiştiğini de."
  - icon: cart
    title: "Alışveriş listesi"
    text: "Geçmiş fişlerinize göre yaklaşık fiyatlarla alışverişinizi planlayın ve grubunuzla ortak liste tutun — kimin ne alacağı görünür."
  - icon: users
    title: "Ortak harcamalar ve borçlar"
    text: "Alışverişi ailenizle ya da arkadaşlarınızla eşit veya fiş kalemlerine göre bölüşün, kimin kime borçlu olduğunu görün, verdiğiniz ve aldığınız borçları takip edin."
  - icon: bolt
    title: "Tek dokunuşla kayıt"
    text: "Otobüs ücreti gibi düzenli ödemeleri şablon olarak kaydedin. Uygulamadan ya da ana ekran widget'ından ekleyin."

