interface_title: "Düşünülen Arayüz"
feat1_title: "Bulut Yapay Zeka Analizi"
feat1_desc: "Fişleriniz gelişmiş sinir ağları (Gemini) tarafından işlenir. Bu, baskı kalitesinden bağımsız olarak öğelerin, tutarların ve tarihlerin kusursuz bir şekilde çıkarılmasını sağlar."
feat2_title: "Tek Sunucu"
feat2_desc: "Veriler geliştiricinin güvenli sunucusunda saklanır. Reklam, izleyici veya gizli analitik satışı kesinlikle yoktur."
feat3_title: "Kategori Mimarisi"
feat3_desc: "Katı iki seviyeli iç içe geçme modeli. Kaos yok — sadece temiz ve anlaşılır harcama analitiği."
feat4_title: "Unutulma Hakkı"
feat4_desc: "Verilerinizi tamamen siz kontrol edersiniz. İstediğiniz zaman hesabı ve tüm işlem geçmişini arayüz üzerinden veya talep üzerine kalıcı olarak silebilirsiniz."
new1_title: "Hareketle Giriş Kontrolü"
new1_desc: "Kırmızı artı düğmesini sola kaydırmak, fiş taraması için kamerayı anında açar. Sağa kaydırmak, cihaz dosyalarından banka ekstrelerini yükler."
new2_title: "Tek Dokunuşla Şablonlar"
new2_desc: "Düzenli işlemleri (örneğin, otobüs bileti) tek dokunuşla oluşturun. Sistem harcamayı anında kaydederek rutin manuel girişi ortadan kaldırır."
new3_title: "Çoklu Para Birimi ve Metaller"
new3_desc: "Herhangi bir para birimi ve değerli metalin ana hesap para birimine otomatik dönüşümü. Veriler açık kaynaklardan çekilir."
new4_title: "Yol Haritası: Geliştirme Aşamasında"
new4_desc: "Masaüstü araç takımları, kağıt fiş olmadan mağazaya dijital iade sistemi ve alışveriş listesi entegrasyonu."
warn_text: "Dikkat: Uygulama erken beta aşamasındadır. Veri güvenliği, olası yazılım hataları ve sistemin çalışması ile ilgili tüm sorumluluk tamamen kullanıcıya aittir."
feedback_text: "Geri bildirim ve hata raporları için memnun olurum:"
feedback_btn: "Geliştiriciye Yazın"
faq_title: "Sıkça Sorulan Sorular"
faq1_q: "Uygulamanın çalışması için internet gerekiyor mu?"
faq1_a: "Evet. Veritabanı ile senkronize olmak ve fişleri sinir ağı işlemine göndermek için sürekli bir ağ bağlantısı gereklidir."
faq2_q: "Verilerimi nasıl silebilirim?"
faq2_a: "Uygulama ayarlarından tüm verilerinizi kendiniz silebilirsiniz. Gerekirse, veritabanındaki tüm izleri manuel olarak temizlemek için doğrudan geliştiriciyle iletişime geçebilirsiniz."
