features_title: "Chek aytib bera oladigan hamma narsa"
features_lead: "ClearSlip hisob yuritishni qo'lda yozishdan xalos qiladi. Ko'pchilik yozuvlar suratdan, bank faylidan yoki bitta bosishdan paydo bo'ladi."
features:
  - icon: receipt
    title: "Cheklarni skanerlash"
    text: "Summa, sana, do'kon, mahsulotlar va kategoriya suratdan to'ldiriladi. Boshqa valyutadagi chek hisob valyutasiga o'tkaziladi."
  - icon: bank
    title: "Ko'chirmalarni import qilish"
    text: "Ziraat Bankası ko'chirmasini yuklang: har bir qator cheklaringiz bilan solishtiriladi, bank komissiyalari operatsiyalarga biriktiriladi. Istalgan bankning PDF o'tkazma kvitansiyalari ham o'qiladi."
  - icon: currency
    title: "Istalgan valyuta va oltin"
    text: "Naqd pul, kartalar, jamg'armalar va kredit kartalarini turli valyutalarda yuriting. Jami joriy kurs bo'yicha hisoblanadi, kurs taxminiy."
  - icon: budget
    title: "Byudjetlar va obunalar"
    text: "Kategoriyaga oylik limit qo'ying va qancha qolganini ko'ring. Muntazam to'lovni to'langan deb belgilang, xarajat o'zi qo'shiladi."
  - icon: chart
    title: "Tushunarli tahlil"
    text: "Xarajatlarni kategoriya, do'kon va mahsulot bo'yicha ko'ring, shu jumladan mahsulot narxi chekdan chekka qanday o'zgarishini."
  - icon: cart
    title: "Xaridlar ro'yxati"
    text: "Xaridlarni rejalashtiring va o'tgan cheklaringiz asosida taxminiy narxlarni ko'ring."
  - icon: users
    title: "Umumiy xarajatlar va qarzlar"
    text: "Xaridni oila yoki do'stlar bilan bo'lishing, kim kimga qarzdorligini ko'ring, bergan va olgan qarzlaringizni kuzating."
  - icon: bolt
    title: "Bir bosishda yozuv"
    text: "Avtobus yo'l haqi kabi muntazam to'lovlarni shablon sifatida saqlang. Ularni ilovadan yoki bosh ekran vidjetidan qo'shing."

interface_title: "Ko'rinishi"
shots: ["Hisoblar", "Yangi xarajat", "Obunalar", "Operatsiyalar"]

how_title: "Chekdan byudjetgacha uch qadamda"
how:
  - title: "Suratga oling"
    text: "Kamerani chekka qarating yoki istalgan ilovadan surat yoki PDF'ni ClearSlip'ga «Ulashish» orqali yuboring."
  - title: "Tekshiring"
    text: "Summa, sana, do'kon va kategoriya allaqachon to'ldirilgan. Xatoni bir bosishda tuzating."
  - title: "Saqlang"
    text: "Xarajat kerakli hisobga tushadi, chek surati esa unga biriktirilgan holda qoladi."

privacy_title: "Ma'lumotlaringiz o'zingizniki"
privacy_lead: "ClearSlip'ni bir kishi ishlab chiqadi, ilovada reklama yo'q. Ma'lumotlaringiz bilan aynan nima bo'lishi quyida."
privacy_more: "Maxfiylik siyosatini o'qish"
privacy:
  - "Ma'lumotlar ishlab chiquvchining o'z serverida, har bir foydalanuvchi uchun alohida bazada saqlanadi. Reklama va reklama kuzatuvchilari yo'q."
  - "Chekni o'qish uchun uning surati Google Gemini'ga yoki OpenRouter orqali zaxira sun'iy intellekt modeliga yuboriladi. Yubormoqchi bo'lmasangiz, xarajatni qo'lda kiriting."
  - "Nosozlik hisobotlari (Sentry) summalar, operatsiya nomlari va chek suratlarini o'z ichiga olmaydi."
  - "Hisobingizni barcha ma'lumotlari bilan istalgan vaqtda ilovadan o'chirishingiz mumkin."

install_title: "Qanday o'rnatiladi"
install_note: "ClearSlip hali Google Play'da yo'q, shuning uchun Android o'rnatishni bir marta tasdiqlashni so'raydi. Yangi versiyalar shu sahifada chiqadi."
install:
  - "APK'ni Android telefoningizga yuklab oling."
  - "Yuklangan faylni oching. Android so'rasa, brauzer yoki fayl menejeriga ilova o'rnatishga ruxsat bering."
  - "Agar Google Play Himoya noma'lum ilova haqida ogohlantirsa, «Batafsil», keyin «Baribir o'rnatish» tugmasini bosing."
  - "ClearSlip'ni oching va login hamda parol bilan hisob yarating."

faq_title: "Savollar"
faq:
  - q: "ClearSlip bepulmi?"
    a: "Ha. Reklama ham, obuna ham yo'q. Xizmat bepul qolishi uchun cheklarni aniqlash har bir hisob uchun kuniga 50 ta skaner bilan cheklangan. Yordam bermoqchi bo'lsangiz, quyidagi qo'llab-quvvatlash tugmasidan foydalaning."
  - q: "iPhone uchun versiya bormi?"
    a: "Hozircha yo'q. ClearSlip hozir faqat Android uchun mavjud."
  - q: "Internetsiz ishlaydimi?"
    a: "Xarajatlarni internetsiz qo'shish mumkin, aloqa paydo bo'lishi bilan ular yuboriladi. Cheklarni skanerlash va ko'chirmalarni import qilish uchun internet kerak."
  - q: "Qaysi banklar qo'llab-quvvatlanadi?"
    a: "To'liq ko'chirma importi hozircha Ziraat Bankası bilan ishlaydi. Boshqa banklarning PDF kvitansiyalarini sun'iy intellekt o'qiydi, istalgan bankdagi hisobni esa qo'lda yuritish mumkin."
  - q: "Cheklar qanchalik aniq o'qiladi?"
    a: "Aniq cheklar yaxshi o'qiladi, lekin rangi o'chgan yoki g'ijimlangan qog'ozda sun'iy intellekt xato qilishi mumkin. Fonda skanerlangan cheklar tekshirib chiqishingiz uchun «Tekshirish» belgisi bilan belgilanadi."
  - q: "Ma'lumotlarimni qanday o'chiraman?"
    a: "Ilovada «Hisob» ekranini oching va hisobni o'chirishni tanlang. Operatsiyalar, cheklar va hisoblar darhol o'chiriladi. Ishlab chiquvchiga elektron pochta orqali ham yozishingiz mumkin."

changelog_title: "Yangiliklar"
changelog:
  - date: "1.2.0, oktyabr 2026"
    text: "Beta-test bo'yicha tuzatishlar: qo'shishda to'g'ri hisob va valyuta, sanani ishonchli kiritish, o'tkazmalar endi ikkiga bo'linmaydi, «To'landi» va «Tarixni tozalash» ishlaydi. Ilova oltita tilga to'liq tarjima qilindi. Chiqish tugmasi va yangi server manzili."
  - date: "1.1.0, sentyabr 2026"
    text: "4×1, 1×4 va 1×1 o'lchamdagi bosh ekran vidjetlari. «Tekshirish» belgili fonda chek skanerlash. Balansni tuzatish uchun raqamli klaviatura. Ilova hajmi kichraydi."
  - date: "1.0, sentyabr 2026"
    text: "Narx prognozli xaridlar ro'yxati. Internetsiz tez ishga tushish. Hisob bilan sinxronlanadigan shablonlar. Tizim «Ulashish» menyusi orqali fayl import qilish."
  - date: "0.9, sentyabr 2026"
    text: "Mahsulotlar tahlili va do'konlardagi narxlarni solishtirish. Valyuta sifatida oltin. Bir nechta valyutadagi qarzlar, bank logotiplari va oltita til."
  - date: "0.8, avgust 2026"
    text: "O'tkazmalar va komissiyalarni ajratib, qog'oz cheklar bilan solishtiradigan Ziraat Bankası ko'chirma importi."
  - date: "0.5–0.7, yoz 2026"
    text: "Hisoblar, kartalar va jamg'armalar. Chekni aniqlashning birinchi versiyasi, joriy kurs bo'yicha o'tkazish va byudjet limitlari."

beta_note: "ClearSlip beta versiyada. Xatolar bo'lishi mumkin, shuning uchun vaqti-vaqti bilan balanslarni tekshiring va biror narsa noto'g'ri ketsa, menga yozing."
