faq1_a: "Ha. Ma'lumotlar bazasi bilan sinxronlashish uchun doimiy tarmoqqa ulanish kerak."
faq2_q: "Ma'lumotlarimni qanday o'chirishim mumkin?"
faq2_a: "Ilova sozlamalari orqali barcha ma'lumotlaringizni o'zingiz o'chirib tashlashingiz mumkin."
