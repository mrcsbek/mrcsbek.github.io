feat1_title: "Bulutli SI tahlili"
feat1_desc: "Cheklaringiz ilg'or neyron tarmoqlar (Gemini) orqali qayta ishlanadi. Bu bosib chiqarish sifatidan qat'i nazar xatosiz ajratib olishni ta'minlaydi."
feat2_title: "Yagona server"
feat2_desc: "Ma'lumotlar dasturchining xavfsiz serverida saqlanadi. Reklama, trekerlar va yashirin analitika savdosi umuman yo'q."
feat3_title: "Kategoriya arxitekturasi"
feat3_desc: "Qat'iy ikki bosqichli ichma-ich model. Hech qanday tartibsizlik yo'q — faqat toza va tushunarli xarajatlar tahlili."
feat4_title: "Unutilish huquqi"
feat4_desc: "Siz o'z ma'lumotlaringizni to'liq nazorat qilasiz. Istalgan vaqtda hisobingizni butunlay o'chirib tashlashingiz mumkin."
new1_title: "Imo-ishora kiritish nazorati"
new1_desc: "Qizil plyus tugmasini chapga surish kamerani ochadi. O'ngga surish bank ko'chirmalarini yuklaydi."
new2_title: "Bir marta bosiladigan shablonlar"
new2_desc: "Doimiy tranzaksiyalarni bir marta bosish bilan yarating. Tizim xarajatni darhol qayd etadi."
new3_title: "Multivalyuta va metallar"
new3_desc: "Har qanday valyuta va metallarni asosiy hisob valyutasiga avtomatik konvertatsiya qilish."
new4_title: "Yo'l xaritasi: Ishlab chiqilmoqda"
new4_desc: "Ish stoli vidjetlari, raqamli qaytarish tizimi va xarid ro'yxatlari integratsiyasi."
