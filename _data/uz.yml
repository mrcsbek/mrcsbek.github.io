features_title: "Chek aytib bera oladigan hamma narsa"
features_lead: "ClearSlip hisob yuritishni qo'lda yozishdan xalos qiladi. Ko'pchilik yozuvlar suratdan, bank faylidan yoki bitta bosishdan paydo bo'ladi."
features:
  - icon: receipt
    title: "Cheklarni skanerlash"
    text: "Summa, sana, do'kon, mahsulotlar va kategoriya suratdan to'ldiriladi. Boshqa valyutadagi chek hisob valyutasiga o'tkaziladi."
  - icon: bank
    title: "Ko'chirmalarni import qilish"
    text: "Ziraat Bankası yoki VakıfBank ko'chirmasini (Excel yoki PDF) yuklang: har bir qator cheklaringiz bilan solishtiriladi, bank komissiyalari operatsiyalarga biriktiriladi. Istalgan bankning PDF o'tkazma kvitansiyalari ham o'qiladi."
  - icon: currency
    title: "Istalgan valyuta va oltin"
    text: "Naqd pul, kartalar, jamg'armalar va kredit kartalarini turli valyutalarda yuriting. Jami joriy kurs bo'yicha hisoblanadi, kurs taxminiy."
  - icon: budget
    title: "Byudjetlar va obunalar"
    text: "Kategoriyaga oylik limit qo'ying va qancha qolganini ko'ring. Muntazam to'lovni to'langan deb belgilang, xarajat o'zi qo'shiladi."
  - icon: chart
    title: "Tushunarli tahlil"
    text: "Xarajatlarni kategoriya, do'kon va mahsulot bo'yicha ko'ring, shu jumladan mahsulot narxi chekdan chekka qanday o'zgarishini."
  - icon: cart
    title: "Xaridlar ro'yxati"
    text: "O'tgan cheklaringiz asosidagi taxminiy narxlar bilan xaridlarni rejalashtiring va guruh bilan umumiy ro'yxat yuriting — kim nima olishi ko'rinadi."
  - icon: users
    title: "Umumiy xarajatlar va qarzlar"
    text: "Xaridni oila yoki do'stlar bilan teng yoki chek pozitsiyalari bo'yicha bo'lishing, kim kimga qarzdorligini ko'ring, bergan va olgan qarzlaringizni kuzating."
  - icon: bolt
    title: "Bir bosishda yozuv"
    text: "Avtobus yo'l haqi kabi muntazam to'lovlarni shablon sifatida saqlang. Ularni ilovadan yoki bosh ekran vidjetidan qo'shing."

