features_title: "Alles, was ein Kassenbon verrät"
features_lead: "ClearSlip nimmt das Tippen aus dem Haushaltsbuch. Die meisten Einträge kommen aus einem Foto, einer Bankdatei oder einem Fingertipp."
features:
  - icon: receipt
    title: "Kassenbons scannen"
    text: "Betrag, Datum, Geschäft, Artikel und Kategorie werden aus dem Foto übernommen. Ein Bon in fremder Währung wird in die Kontowährung umgerechnet."
  - icon: bank
    title: "Kontoauszüge importieren"
    text: "Lade einen Auszug der Ziraat Bankası: Jede Zeile wird mit deinen Bons abgeglichen, Bankgebühren werden den Buchungen zugeordnet. PDF-Überweisungsbelege jeder Bank werden ebenfalls gelesen."
  - icon: currency
    title: "Jede Währung, auch Gold"
    text: "Bargeld, Karten, Ersparnisse und Kreditkarten in verschiedenen Währungen. Summen werden zum aktuellen Kurs berechnet, der Kurs ist ein Näherungswert."
  - icon: budget
    title: "Budgets und Abos"
    text: "Lege ein Monatslimit pro Kategorie fest und sieh, was noch übrig ist. Markiere eine regelmäßige Zahlung als bezahlt, und die Ausgabe wird eingetragen."
  - icon: chart
    title: "Verständliche Auswertung"
    text: "Ausgaben nach Kategorie, Geschäft und Produkt, auch wie sich der Preis eines Produkts von Bon zu Bon ändert."
  - icon: cart
    title: "Einkaufsliste"
    text: "Plane deine Einkäufe und sieh geschätzte Preise aus deinen bisherigen Bons."
  - icon: users
    title: "Geteilte Kosten und Schulden"
    text: "Teile einen Einkauf mit Familie oder Freunden, sieh, wer wem etwas schuldet, und behalte verliehenes oder geliehenes Geld im Blick."
  - icon: bolt
    title: "Einträge mit einem Tipp"
    text: "Speichere regelmäßige Zahlungen wie eine Busfahrt als Vorlagen. Trage sie in der App oder über ein Widget auf dem Startbildschirm ein."

