hero_title: "Kassenbon fotografieren. Die Ausgabe trägt sich selbst ein."
hero_sub: "ClearSlip ist eine App für persönliche Finanzen auf Android. Sie liest Kassenbons mit KI, importiert Kontoauszüge und führt jedes Konto in seiner eigenen Währung. Ohne Werbung."
