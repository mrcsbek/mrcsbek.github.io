how_title: "Vom Bon zum Budget in drei Schritten"
how:
  - title: "Foto machen"
    text: "Halte die Kamera auf den Bon oder teile ein Foto oder PDF aus einer beliebigen App mit ClearSlip."
  - title: "Prüfen"
    text: "Betrag, Datum, Geschäft und Kategorie sind schon ausgefüllt. Korrigiere bei Bedarf mit einem Tipp."
  - title: "Speichern"
    text: "Die Ausgabe landet auf dem richtigen Konto, das Foto des Bons bleibt daran angehängt."

privacy_title: "Deine Daten bleiben deine"
privacy_lead: "ClearSlip wird von einer Person entwickelt und zeigt keine Werbung. Hier steht genau, was mit deinen Daten passiert."
privacy_more: "Datenschutzerklärung lesen"
privacy:
  - "Die Daten liegen auf dem eigenen Server des Entwicklers, für jeden Nutzer in einer eigenen Datenbank. Keine Werbung und keine Werbe-Tracker."
  - "Zum Lesen eines Bons wird sein Foto an Google Gemini oder über OpenRouter an ein KI-Ersatzmodell gesendet. Wenn du das nicht möchtest, trage die Ausgabe von Hand ein."
  - "Absturzberichte (Sentry) enthalten keine Beträge, Buchungsnamen oder Fotos von Bons."
  - "Du kannst dein Konto mit allen Daten jederzeit in der App löschen."

install_title: "So installieren"
install_note: "ClearSlip ist noch nicht bei Google Play, deshalb bittet Android einmal um Bestätigung der Installation. Neue Versionen erscheinen auf dieser Seite."
install:
  - "Lade die APK auf dein Android-Telefon herunter."
  - "Öffne die heruntergeladene Datei. Wenn Android fragt, erlaube deinem Browser oder Dateimanager, Apps zu installieren."
  - "Warnt Google Play Protect vor einer unbekannten App, tippe auf „Weitere Details“ und dann auf „Trotzdem installieren“."
  - "Öffne ClearSlip und erstelle ein Konto mit Benutzername und Passwort."

faq_title: "Fragen"
faq:
  - q: "Ist ClearSlip kostenlos?"
    a: "Ja. Es gibt keine Werbung und keine Abos. Die Bon-Erkennung ist auf 50 Scans pro Tag und Konto begrenzt, damit der Dienst kostenlos bleiben kann. Wenn du helfen möchtest, nutze den Unterstützen-Button unten."
  - q: "Gibt es eine iPhone-Version?"
    a: "Noch nicht. ClearSlip gibt es vorerst nur für Android."
  - q: "Funktioniert es ohne Internet?"
    a: "Ausgaben kannst du offline eintragen; sie werden gesendet, sobald wieder Verbindung besteht. Für das Scannen von Bons und den Import von Auszügen braucht es Internet."
  - q: "Welche Banken werden unterstützt?"
    a: "Der vollständige Import von Auszügen funktioniert vorerst mit der Ziraat Bankası. PDF-Belege anderer Banken liest die KI, und Konten bei jeder Bank lassen sich von Hand führen."
  - q: "Wie genau ist die Erkennung?"
    a: "Klare Bons werden gut gelesen, auf verblasstem oder zerknittertem Papier kann sich die KI irren. Im Hintergrund gescannte Bons werden mit „Prüfen“ markiert, damit du sie kontrollieren kannst."
  - q: "Wie lösche ich meine Daten?"
    a: "Öffne in der App den Bildschirm Konto und wähle das Löschen des Kontos. Buchungen, Bons und Konten werden sofort gelöscht. Du kannst dem Entwickler auch eine E-Mail schreiben."

changelog_title: "Neuigkeiten"
changelog:
  - date: "1.2.4, Oktober 2026"
    text: "Funktioniert offline: Buchungen, Schulden, Überweisungen und Belege werden auf dem Telefon gespeichert und automatisch gesendet; ein pulsierender Saldo zeigt fehlende Verbindung. Kontenarchiv, Kategoriefilter, Schulden mit einem Tipp begleichen, Kurs und Gutschrift bei Überweisungen zwischen Währungen. Korrekturen für gemeinsame Einkäufe, Vorlagen, Orte und viele Kleinigkeiten."
  - date: "1.2.1, Oktober 2026"
    text: "Kontenarchiv und Filtern von Buchungen nach Kategorie. Löschen per Wischen fragt jetzt nach. Erinnerungen kommen pünktlich, mit neuem Benachrichtigungssymbol. Besserer Schutz für deine Daten und den Server."
  - date: "1.2.0, Oktober 2026"
    text: "Korrekturen aus dem Betatest: richtiges Konto und richtige Währung beim Hinzufügen, sichere Datumseingabe, Überweisungen bleiben zusammen, „Als bezahlt markieren“ und „Verlauf löschen“ funktionieren. Die App ist vollständig in sechs Sprachen übersetzt. Abmelde-Button und neue Serveradresse."
  - date: "1.1.0, September 2026"
    text: "Widgets für den Startbildschirm in 4×1, 1×4 und 1×1. Bon-Scan im Hintergrund mit der Markierung „Prüfen“. Ziffernblock zum Korrigieren von Salden. Kleinere App."
  - date: "1.0, September 2026"
    text: "Einkaufslisten mit Preisschätzung. Sofortiger Start ohne Internet. Mit dem Konto synchronisierte Vorlagen. Datei-Import über das Teilen-Menü des Systems."
  - date: "0.9, September 2026"
    text: "Produktauswertung und Preisvergleich zwischen Geschäften. Gold als Währung. Schulden in mehreren Währungen, Banklogos und sechs Sprachen."
  - date: "0.8, August 2026"
    text: "Import von Ziraat-Bankası-Auszügen, der Überweisungen und Gebühren trennt und mit Papierbons abgleicht."
  - date: "0.5–0.7, Sommer 2026"
    text: "Konten, Karten und Ersparnisse. Erste Version der Bon-Erkennung, Umrechnung zum aktuellen Kurs und Budgetlimits."

