changelog_title: "MoneyApp Änderungsprotokoll"
changelog:
  - date: "Version 1.0 (21. September 2026)"
    text: "Großes Update. 5 Widgets. Hintergrund-Belegscan mit automatischer Summenvalidierung. Ziffernblock für Kontostände. App-Größe reduziert."
  - date: "Version 0.9 (Mitte September)"
    text: "Einkaufslisten mit Preisvorhersage. Offline-Start. Cloud-Vorlagen und Integration des 'Teilen'-Menüs zum schnellen Importieren."
  - date: "Version 0.8 (Anfang September)"
    text: "Produktanalyse: Preise verfolgen und Geschäfte vergleichen. Gold als Währung. Schulden in mehreren Währungen, Banklogos und 6 Sprachen."
  - date: "Version 0.7 (Ende August)"
    text: "Import von Kontoauszügen (Ziraat). Automatische Klassifizierung von Überweisungen. Abgleich von Papierbelegen mit dem Bankverlauf."
  - date: "Version 0.5 (August)"
    text: "Alpha-Release: Konten und Ersparnisse. KI-Belegerkennung, Live-Multiwährung und Budgetgrenzen."
interface_title: "Durchdachte Benutzeroberfläche"
