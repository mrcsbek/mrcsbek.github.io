interface_title: "Продуманный интерфейс"
feat1_title: "Облачный ИИ-анализ"
feat1_desc: "Ваши чеки обрабатываются передовыми нейросетями (Gemini). Это обеспечивает безошибочное извлечение позиций, сумм и дат независимо от качества печати."
feat2_title: "Единый сервер"
feat2_desc: "Данные хранятся на защищенном сервере разработчика. Полное отсутствие рекламы, трекеров и скрытой продажи аналитики."
feat3_title: "Архитектура категорий"
feat3_desc: "Строгая двухуровневая модель вложенности. Никакого хаоса — только чистая и понятная аналитика расходов."
feat4_title: "Право на забвение"
feat4_desc: "Вы полностью контролируете свои данные. В любой момент можно безвозвратно удалить аккаунт и всю историю транзакций через интерфейс или по запросу."
new1_title: "Жестовое управление вводом"
new1_desc: "Свайп красной кнопки плюса влево моментально открывает камеру для сканирования чека. Свайп вправо — загружает банковские выписки (деконты) из файлов устройства."
new2_title: "Шаблоны в один тап"
new2_desc: "Создание регулярных транзакций (например, оплата проезда в автобусе) одним нажатием. Система фиксирует расход мгновенно, исключая рутинный ручный ввод."
new3_title: "Мультивалютность и металлы"
new3_desc: "Автоматическая конвертация любых валют и драгметаллов в основную валюту учета. Данные подтягиваются из открытых источников. Указанный курс является ориентировочным для комфортной оценки баланса."
new4_title: "Roadmap: В разработке"
new4_desc: "Виджеты для рабочего стола, система цифрового возврата товаров в магазин без бумажного чека и интеграция списков покупок с автоматической синхронизацией транзакций."
warn_text: "Внимание: Приложение находится в стадии ранней бета-версии. Вся ответственность за сохранность данных, возможные программные сбои и работу системы лежит исключительно на пользователе."
