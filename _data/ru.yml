faq_title: "Вопросы"
faq:
  - q: "ClearSlip бесплатный?"
    a: "Да. Нет рекламы и подписок. Распознавание чеков ограничено 20 сканами в сутки на аккаунт, чтобы сервис оставался бесплатным. Если хотите помочь, нажмите кнопку поддержки ниже."
  - q: "Есть версия для iPhone?"
    a: "Пока нет. Сейчас ClearSlip доступен только для Android."
  - q: "Работает ли без интернета?"
    a: "Да. Счета и операции открываются с телефона, а всё, что вы добавите, измените или удалите без сети, сохранится и отправится, как только появится связь. Для сканирования чеков и импорта выписок нужен интернет."
  - q: "Какие банки поддерживаются?"
    a: "Полный импорт выписок работает с Ziraat Bankası и VakıfBank; PDF-выписки других банков читаются, если в них есть таблица. PDF-квитанции переводов читает ИИ, а счета в любом банке можно вести вручную."
  - q: "Насколько точно распознаются чеки?"
    a: "Чёткие чеки читаются хорошо, но на выцветшей или мятой бумаге ИИ может ошибиться. Чеки, отправленные на фоновое сканирование, получают метку «Проверить», чтобы вы их просмотрели."
  - q: "Как удалить свои данные?"
    a: "Откройте в приложении экран «Аккаунт» и выберите удаление аккаунта. Операции, чеки и счета стираются сразу. Также можно написать разработчику на почту."

changelog_title: "Что нового"
changelog:
  - date: "1.2.9, октябрь 2026"
    text: "Шаблоны: правка названия, суммы и счёта, своя валюта шаблона с пересчётом по курсу дня, иконки и суммы с копейками. «Отменить» после быстрого шаблона снова работает. Удаление без интернета сразу меняет баланс, включая переводы. Мелкие исправления интерфейса."
  - date: "1.2.8, октябрь 2026"
    text: "Исправления после проверки на телефоне: карточка операции открывается и правится без интернета, удаление без связи сразу меняет баланс, таблица общих трат не искажается после «Рассчитались». Из чека в «Место» попадает название магазина, суммы всегда с двумя знаками копеек, первое касание при открытой клавиатуре больше не теряется."
  - date: "1.2.7, октябрь 2026"
    text: "Приложение теперь на французском и арабском, для арабского интерфейс полностью отзеркален справа налево. Обновлены политика конфиденциальности и условия использования: голосовой ввод и работа без интернета описаны точно. В «Совместных тратах» появилась кнопка «Рассчитались» — долг закрывается одним касанием, расчёт можно отменить."
  - date: "1.2.6, октябрь 2026"
    text: "Полноценная работа без интернета: счета, операции и остальное открываются сразу, а любые изменения — правки, удаления, список покупок — хранятся на телефоне и уходят сами, когда появится связь. Общий чек можно разделить по позициям, у группы появился общий список покупок с отметкой «кто купит», в списке можно указать штуки или килограммы. Импорт выписок VakıfBank и выписок в PDF. Короткое знакомство с приложением при первом входе."
  - date: "1.2.4, октябрь 2026"
    text: "Работа без интернета: операции, долги, переводы и чеки сохраняются на телефоне и отправляются сами, мерцающий итог показывает, что связи нет. Архив счетов, фильтр по категории, погашение долга в одно касание, курс и сумма зачисления при переводе между валютами. Исправлены общие покупки, шаблоны, места и десятки мелочей."
  - date: "1.2.1, октябрь 2026"
    text: "Архив счетов и фильтр операций по категории. Удаление свайпом теперь спрашивает подтверждение. Напоминания приходят точно в срок, новая иконка уведомлений. Улучшена защита данных и сервера."
  - date: "1.2.0, октябрь 2026"
    text: "Исправления по итогам бета-теста: правильный счёт и валюта при добавлении, надёжный ввод даты, переводы больше не распадаются на половины, работают «Оплачено» и «Очистить историю». Приложение полностью переведено на шесть языков. Кнопка выхода и новый адрес сервера."
  - date: "1.1.0, сентябрь 2026"
    text: "Виджеты на главный экран размером 4×1, 1×4 и 1×1. Фоновое сканирование чеков с меткой «Проверить». Цифровая клавиатура для правки балансов. Приложение стало легче."
  - date: "1.0, сентябрь 2026"
    text: "Списки покупок с прогнозом цен. Мгновенный запуск без интернета. Шаблоны синхронизируются с аккаунтом. Импорт файлов через системное меню «Поделиться»."
  - date: "0.9, сентябрь 2026"
    text: "Аналитика по товарам и сравнение цен в магазинах. Золото как валюта. Долги в нескольких валютах, логотипы банков и шесть языков."
  - date: "0.8, август 2026"
    text: "Импорт выписок Ziraat Bankası: переводы и комиссии раскладываются сами и сверяются с бумажными чеками."
  - date: "0.5–0.7, лето 2026"
    text: "Счета, карты и накопления. Первая версия распознавания чеков, пересчёт по текущему курсу и лимиты бюджетов."

