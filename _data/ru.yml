faq_title: "Частые вопросы"
faq1_q: "Нужен ли интернет для работы приложения?"
faq1_a: "Да. Постоянное подключение к сети необходимо для синхронизации с базой данных и отправки чеков на обработку нейросети."
faq2_q: "Как удалить свои данные?"
faq2_a: "Вы можете снести все данные о себе самостоятельно через настройки приложения. Если потребуется, вы можете обратиться напрямую к разработчику для ручной очистки всех хвостов в БД."
