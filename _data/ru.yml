features_title: "Всё, что может рассказать чек"
features_lead: "ClearSlip избавляет учёт от ручного ввода. Большинство операций появляется из фото, банковского файла или одного нажатия."
features:
  - icon: receipt
    title: "Сканирование чеков"
    text: "Сумма, дата, магазин, позиции и категория заполняются по фото. Чек в другой валюте пересчитывается в валюту счёта."
  - icon: bank
    title: "Импорт выписок"
    text: "Загрузите выписку Ziraat Bankası: каждая строка сопоставится с вашими чеками, а комиссии банка прикрепятся к операциям. PDF-квитанции переводов любого банка тоже распознаются."
  - icon: currency
    title: "Любые валюты и золото"
    text: "Наличные, карты, накопления и кредитки в разных валютах. Итоги считаются по текущему курсу, он приблизительный."
  - icon: budget
    title: "Бюджеты и подписки"
    text: "Задайте месячный лимит на категорию и смотрите, сколько осталось. Отметьте регулярный платёж оплаченным, и расход добавится сам."
  - icon: chart
    title: "Понятная аналитика"
    text: "Расходы по категориям, магазинам и товарам, в том числе как меняется цена товара от чека к чеку."
  - icon: cart
    title: "Список покупок"
    text: "Планируйте покупки и смотрите примерную стоимость по вашим прошлым чекам."
  - icon: users
    title: "Общие расходы и долги"
    text: "Делите покупки с семьёй или друзьями, смотрите, кто кому должен, и учитывайте деньги, которые дали или взяли в долг."
  - icon: bolt
    title: "Операции в одно нажатие"
    text: "Сохраните регулярные платежи, например проезд в автобусе, как шаблоны. Добавляйте их в приложении или с виджета на главном экране."

