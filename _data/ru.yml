privacy_title: "Ваши данные остаются вашими"
privacy_lead: "ClearSlip разрабатывает один человек, рекламы в приложении нет. Вот что именно происходит с вашими данными."
privacy_more: "Политика конфиденциальности"
privacy:
  - "Данные хранятся на собственном сервере разработчика, у каждого пользователя своя отдельная база. Нет рекламы и рекламных трекеров."
  - "Чтобы прочитать чек или голосовую заметку, фото или запись отправляется в Google Gemini или в запасную ИИ-модель через OpenRouter. Не хотите отправлять — внесите расход вручную."
  - "Отчёты о сбоях (Sentry) не содержат сумм, названий операций и фото чеков."
  - "Аккаунт со всеми данными можно удалить из приложения в любой момент."

