features_title: "Everything a receipt can tell you"
features_lead: "ClearSlip takes the typing out of budgeting. Most entries come from a photo, a bank file or one tap."
features:
  - icon: receipt
    title: "Scan receipts"
    text: "Amount, date, store, items and category are filled in from a photo. A receipt in another currency is converted to the account's currency."
  - icon: bank
    title: "Import bank statements"
    text: "Load a Ziraat Bankası statement and each line is matched to your receipts, with bank fees attached. PDF transfer receipts from any bank are read too."
  - icon: currency
    title: "Any currency, and gold"
    text: "Keep cash, cards, savings and credit cards in different currencies. Totals use current exchange rates, which are approximate."
  - icon: budget
    title: "Budgets and subscriptions"
    text: "Set a monthly limit for a category and see what is left. Mark a recurring payment as paid and the expense is added for you."
  - icon: chart
    title: "Clear analytics"
    text: "See spending by category, by store and by product, including how the price of a product changes from receipt to receipt."
  - icon: cart
    title: "Shopping list"
    text: "Plan what to buy and get price estimates from your own past receipts."
  - icon: users
    title: "Shared costs and debts"
    text: "Split a purchase with family or friends, see who owes whom and keep track of money you lent or borrowed."
  - icon: bolt
    title: "One-tap entries"
    text: "Save regular payments, like a bus fare, as templates. Add them in the app or from a home screen widget."

