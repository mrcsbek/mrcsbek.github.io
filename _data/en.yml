changelog_title: "MoneyApp Changelog"
changelog:
  - date: "Version 1.0 (September 21, 2026)"
    text: "Major update. 5 home screen widgets. Background receipt scanning with automatic sum validation. Digital numpad for balances. App size drastically reduced."
  - date: "Version 0.9 (Mid-September)"
    text: "Smart shopping lists with price prediction. Instant offline launch. Cloud-synced templates and system 'Share' menu integration for quick import."
  - date: "Version 0.8 (Early September)"
    text: "Product-level analytics: track specific item prices and compare stores. Gold integrated as a currency. Multi-currency debts, bank logos, and 6 languages."
  - date: "Version 0.7 (Late August)"
    text: "Direct bank statement import (Ziraat). Auto-classification of transfers and fees. Smart reconciliation of paper receipts with bank history."
  - date: "Version 0.5 (August)"
    text: "Alpha release: accounts, cards, and savings architecture. Basic AI receipt recognition, live multi-currency conversions, and budget limits."
interface_title: "Thoughtful Interface"
feat1_title: "Cloud AI Analysis"
feat1_desc: "Your receipts are processed by advanced neural networks (Gemini). This ensures flawless extraction of items, amounts, and dates regardless of print quality."
feat2_title: "Single Server"
feat2_desc: "Data is stored on the developer's secure server. Absolutely no ads, trackers, or hidden analytics sales."
feat3_title: "Category Architecture"
feat3_desc: "Strict two-level nesting model. No chaos — only clean and understandable expense analytics."
feat4_title: "Right to be Forgotten"
feat4_desc: "You fully control your data. At any time, you can permanently delete your account and all transaction history via the interface or by request."
new1_title: "Gesture Input Control"
new1_desc: "Swiping the red plus button left instantly opens the camera for receipt scanning. Swiping right loads bank statements from device files."
new2_title: "One-tap Templates"
new2_desc: "Create regular transactions (e.g., bus fare) with one tap. The system records the expense instantly, eliminating routine manual input."
new3_title: "Multicurrency & Metals"
new3_desc: "Automatic conversion of any currencies and precious metals into the main accounting currency. Data is pulled from open sources."
new4_title: "Roadmap: In Development"
new4_desc: "Desktop widgets, digital return system for stores without a paper receipt, and shopping list integration."
warn_text: "Attention: The application is in early beta. All responsibility for data safety, possible software glitches, and system operation lies entirely with the user."
feedback_text: "I would appreciate feedback and bug reports:"
feedback_btn: "Write to Developer"
faq_title: "Frequently Asked Questions"
faq1_q: "Do I need internet for the app to work?"
faq1_a: "Yes. A persistent network connection is required to sync with the database and send receipts for neural network processing."
faq2_q: "How do I delete my data?"
faq2_a: "You can wipe all your data yourself through the app settings. If necessary, you can contact the developer directly to manually clear all traces in the database."
