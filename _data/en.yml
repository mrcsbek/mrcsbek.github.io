how_title: "From receipt to budget in three steps"
how:
  - title: "Take a photo"
    text: "Point the camera at the receipt, or share a photo or PDF to ClearSlip from any app."
  - title: "Check the details"
    text: "The amount, date, store and category are already filled in. Correct anything with a tap."
  - title: "Save"
