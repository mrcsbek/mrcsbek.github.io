privacy_title: "Your data stays yours"
privacy_lead: "ClearSlip is developed by one person and shows no ads. Here is exactly what happens to your data."
privacy_more: "Read the privacy policy"
privacy:
  - "Data is kept on the developer's own server, in a separate database for each user. No ads and no advertising trackers."
  - "To read a receipt, its photo is sent to Google Gemini, or to a backup AI model through OpenRouter. Type the expense in by hand if you prefer not to send it."
  - "Crash reports (Sentry) contain no amounts, names or receipt photos."
  - "You can delete your account with all its data from the app at any time."

install_title: "How to install"
install_note: "ClearSlip is not on Google Play yet, so Android asks you to confirm the installation once. New versions are published on this page."
install:
  - "Download the APK on your Android phone."
  - "Open the downloaded file. If Android asks, allow your browser or file manager to install apps."
  - "If Google Play Protect warns about an unknown app, tap “More details”, then “Install anyway”."
  - "Open ClearSlip and create an account with a username and password."

faq_title: "Questions"
faq:
  - q: "Is ClearSlip free?"
    a: "Yes. There are no ads and no subscriptions. Receipt recognition is limited to 50 scans per day per account so the service can stay free. If you want to help, use the support button below."
  - q: "Is there an iPhone version?"
    a: "Not yet. For now ClearSlip is available for Android only."
  - q: "Does it work without internet?"
    a: "You can add expenses offline; they are sent as soon as the connection returns. Scanning receipts and importing statements need internet."
  - q: "Which banks are supported?"
    a: "Full statement import works with Ziraat Bankası for now. PDF transfer receipts from other banks are read by AI, and accounts at any bank can be kept by hand."
  - q: "How accurate is receipt recognition?"
    a: "Clear receipts are read well, but AI can make mistakes on faded or crumpled paper. Receipts sent for background scanning are marked “Review” so you can check them."
  - q: "How do I delete my data?"
    a: "Open the Account screen in the app and choose to delete your account. Operations, receipts and accounts are erased immediately. You can also ask the developer by email."

changelog_title: "What's new"
changelog:
  - date: "1.1.0, September 2026"
    text: "Home screen widgets in 4×1, 1×4 and 1×1 sizes. Background receipt scanning with a “Review” mark. A number pad for correcting balances. A smaller app."
  - date: "1.0, September 2026"
    text: "Shopping lists with price estimates. Instant start without internet. Templates synced to your account. Import files through the system Share menu."
  - date: "0.9, September 2026"
    text: "Product analytics and price comparison between stores. Gold as a currency. Debts in several currencies, bank logos and six languages."
  - date: "0.8, August 2026"
    text: "Ziraat Bankası statement import that sorts transfers and fees and matches them with paper receipts."
  - date: "0.5 to 0.7, summer 2026"
    text: "Accounts, cards and savings. First version of AI receipt recognition, conversion at live rates and budget limits."

