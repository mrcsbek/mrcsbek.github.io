hero_title: "Photographiez un ticket. La dépense se remplit toute seule."
hero_sub: "ClearSlip est une application de finances personnelles pour Android. Elle lit les tickets grâce à l’IA, importe les relevés bancaires et garde chaque compte dans sa propre devise. Sans publicité."
hero_note: "Pas encore sur Google Play. Installez l’APK depuis cette page."

demo_label: "Un ticket Migros transformé en dépense"
